name: content-validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 라이선스 게이트 — 컨테이너 없는 가벼운 job. UNITY_LICENSE 시크릿이 없으면 Unity job을
  # 통째로 skip시켜 무거운 unityci Docker 이미지 pull 자체를 회피한다(pull flaky 제거).
  # 라이선스를 등록하면 available=true가 되어 아래 job들이 자동으로 다시 실행된다.
  unity-gate:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check Unity license availability
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        shell: bash
        run: |
          if [[ -n "${UNITY_LICENSE:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::UNITY_LICENSE secret 미설정 — Unity Docker job 스킵(이미지 pull 회피, flaky 제거). 라이선스 설정 시 자동 재활성화."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  content-validation:
    needs: unity-gate
    if: needs.unity-gate.outputs.available == 'true'
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.4.0f1-base-3
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Activate Unity license
        id: unity-license
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs
          if [[ -z "${UNITY_LICENSE:-}" ]]; then
            echo "::notice::UNITY_LICENSE secret is not configured; skipping Unity batch validation."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          license_file="$RUNNER_TEMP/unity-license.ulf"
          printf '%s' "$UNITY_LICENSE" > "$license_file"
          chmod 600 "$license_file"
          if /opt/unity/Editor/Unity \
            -batchmode \
            -nographics \
            -quit \
            -manualLicenseFile "$license_file" \
            -logFile Logs/unity-license-activation.log; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Unity license activation failed; skipping Unity batch validation. Check Logs/unity-license-activation.log artifact."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run content validation batch
        if: steps.unity-license.outputs.available == 'true'
        run: >
          /opt/unity/Editor/Unity
          -batchmode
          -nographics
          -projectPath .
          -quit
          -logFile Logs/content-validation-ci.log
          -executeMethod SM.Editor.Validation.ValidationBatchEntryPoint.RunContentValidation

      - name: Run balance sweep smoke batch
        if: steps.unity-license.outputs.available == 'true'
        run: >
          /opt/unity/Editor/Unity
          -batchmode
          -nographics
          -projectPath .
          -quit
          -logFile Logs/balance-sweep-ci.log
          -executeMethod SM.Editor.Validation.ValidationBatchEntryPoint.RunBalanceSweepSmoke

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: content-validation-artifacts
          path: |
            Logs/content-validation/**
            Logs/balance-sweep/**
            Logs/unity-license-activation.log
            Logs/content-validation-ci.log
            Logs/balance-sweep-ci.log

  editmode-validation-tests:
    needs: unity-gate
    if: needs.unity-gate.outputs.available == 'true'
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.4.0f1-base-3
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Activate Unity license
        id: unity-license
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/editmode-validation
          if [[ -z "${UNITY_LICENSE:-}" ]]; then
            echo "::notice::UNITY_LICENSE secret is not configured; skipping Unity EditMode validation."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          license_file="$RUNNER_TEMP/unity-license.ulf"
          printf '%s' "$UNITY_LICENSE" > "$license_file"
          chmod 600 "$license_file"
          if /opt/unity/Editor/Unity \
            -batchmode \
            -nographics \
            -quit \
            -manualLicenseFile "$license_file" \
            -logFile test-results/editmode-validation/unity-license-activation.log; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Unity license activation failed; skipping Unity EditMode validation. Check unity-license-activation.log artifact."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run EditMode validation and compile tests (Unity 6000.4.0f1)
        if: steps.unity-license.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/editmode-validation
          /opt/unity/Editor/Unity \
            -batchmode \
            -nographics \
            -projectPath . \
            -runTests \
            -testPlatform EditMode \
            -testResults test-results/editmode-validation/results.xml \
            -logFile test-results/editmode-validation/unity.log

      - name: Upload EditMode validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-editmode-validation-results
          path: test-results/editmode-validation
