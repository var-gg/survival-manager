name: unity-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 라이선스 게이트 — 컨테이너 없는 가벼운 job. UNITY_LICENSE 시크릿이 없으면 Unity job을
  # 통째로 skip시켜 무거운 unityci Docker 이미지 pull 자체를 회피한다(pull flaky 제거).
  # 라이선스를 등록하면 available=true가 되어 아래 job들이 자동으로 다시 실행된다.
  unity-gate:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check Unity license availability
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        shell: bash
        run: |
          if [[ -n "${UNITY_LICENSE:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::UNITY_LICENSE secret 미등록 — Unity 테스트 job 전체 skip. 이 런의 success는 Unity 컴파일/테스트를 포함하지 않는다."
            {
              echo "## ⚠️ Unity 테스트 게이트 SKIP — 이 초록은 Unity 검증 없음"
              echo ""
              echo '`UNITY_LICENSE` 시크릿이 없어 Unity 배치 job이 전부 건너뛰어졌다.'
              echo "로컬 보완 게이트: \`pwsh -File tools/clean-clone-witness.ps1\` (라이선스 머신에서 fresh clone 전체 검증)."
              echo ""
              echo "등록 절차: Actions에서 \`unity-license-request\` 워크플로 실행 → .alf 아티팩트 다운로드 →"
              echo "https://license.unity3d.com/manual 에서 .ulf 교환 → \`gh secret set UNITY_LICENSE < Unity_v*.ulf\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  editmode-tests:
    needs: unity-gate
    if: needs.unity-gate.outputs.available == 'true'
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.4.7f1-base-3
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Activate Unity license
        id: unity-license
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/editmode
          if [[ -z "${UNITY_LICENSE:-}" ]]; then
            echo "::notice::UNITY_LICENSE secret is not configured; skipping Unity EditMode tests."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          license_file="$RUNNER_TEMP/unity-license.ulf"
          printf '%s' "$UNITY_LICENSE" > "$license_file"
          chmod 600 "$license_file"
          if /opt/unity/Editor/Unity \
            -batchmode \
            -nographics \
            -quit \
            -manualLicenseFile "$license_file" \
            -logFile test-results/editmode/unity-license-activation.log; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Unity license activation failed; skipping Unity EditMode tests. Check unity-license-activation.log artifact."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run EditMode scene integrity + domain tests (Unity 6000.4.7f1)
        if: steps.unity-license.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/editmode
          /opt/unity/Editor/Unity \
            -batchmode \
            -nographics \
            -projectPath . \
            -runTests \
            -testPlatform EditMode \
            -testResults test-results/editmode/results.xml \
            -logFile test-results/editmode/unity.log

      - name: Upload EditMode results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-editmode-results
          path: test-results/editmode

  playmode-smoke:
    needs: unity-gate
    if: needs.unity-gate.outputs.available == 'true'
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.4.7f1-base-3
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Activate Unity license
        id: unity-license
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/playmode
          if [[ -z "${UNITY_LICENSE:-}" ]]; then
            echo "::notice::UNITY_LICENSE secret is not configured; skipping Unity PlayMode tests."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          license_file="$RUNNER_TEMP/unity-license.ulf"
          printf '%s' "$UNITY_LICENSE" > "$license_file"
          chmod 600 "$license_file"
          if /opt/unity/Editor/Unity \
            -batchmode \
            -nographics \
            -quit \
            -manualLicenseFile "$license_file" \
            -logFile test-results/playmode/unity-license-activation.log; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Unity license activation failed; skipping Unity PlayMode tests. Check unity-license-activation.log artifact."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PlayMode bootstrap + loop smoke tests (Unity 6000.4.7f1)
        if: steps.unity-license.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/playmode
          /opt/unity/Editor/Unity \
            -batchmode \
            -nographics \
            -projectPath . \
            -runTests \
            -testPlatform PlayMode \
            -testResults test-results/playmode/results.xml \
            -logFile test-results/playmode/unity.log

      - name: Upload PlayMode results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-playmode-results
          path: test-results/playmode
