<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Atlas — 원정 지도 · Survival Manager</title>
<meta name="viewport" content="width=1920" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
/* ==========================================================
   SURVIVAL MANAGER — ATLAS PANEL
   Unity USS-compat CSS subset:
   - flexbox only (NO grid)
   - NO transform / animation / box-shadow / linear-gradient
   - Solid colors + borders + nested wrappers for double-line frames
   - All visual richness lives inside inline SVG sprites
   ========================================================== */
:root{
  --bg-0:#0c1126; --bg-1:#141a35; --bg-2:#1c2243; --bg-3:#262d54;
  --line-1:#2c3568; --line-2:#3b467f;
  --vellum:#f5ead0; --vellum-2:#e2d4ad;
  --gold-100:#ffe9a8; --gold-200:#f5d68a; --gold-300:#e6b751;
  --gold-400:#c8932a; --gold-500:#8a6418; --gold-600:#5a4210;
  --ink-1:#f5ead0; --ink-2:#d8c799; --ink-3:#9d8a5e; --ink-4:#6b5d3f;
  --state-safe:#6dbf78; --state-safe-deep:#1e4a26;
  --state-warn:#e8a93b; --state-danger:#e25548;
  --state-locked:#5a6280; --state-locked-deep:#2a304a;
  --state-injured:#b6334a;
  --rare-rare:#5b8ed1; --rare-rare-glow:#9bbeed;
  --f-ko:"Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-en-display:"Cinzel","Trajan Pro",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html, body{ background:#05070f; }
body{
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:24px;
  color:var(--ink-1); font-family:var(--f-ko);
  font-feature-settings:"ss06","tnum";
}

/* === ROOT FRAME ============================================ */
.atlas{
  width:1920px; height:1080px;
  position:relative; flex-shrink:0;
  background-color:var(--bg-0);
  color:var(--ink-1);
  display:flex; flex-direction:column;
  overflow:hidden;
  border:1px solid var(--gold-500);
}

/* === HEADER ================================================ */
.atlas-header{
  display:flex; align-items:center;
  height:108px; flex-shrink:0;
  padding:0 36px;
  background-color:var(--bg-1);
  border-bottom:1px solid var(--gold-500);
  position:relative;
}
.header-rule{
  position:absolute; left:18px; right:18px; bottom:-4px;
  height:1px; background-color:var(--gold-300);
}
.compass-frame{
  width:72px; height:72px; flex-shrink:0;
  position:relative;
  display:flex; align-items:center; justify-content:center;
}
.compass-frame svg{ width:72px; height:72px; }

.atlas-title{
  display:flex; align-items:baseline; gap:20px;
  margin-left:22px;
}
.atlas-title .ko{
  font-family:var(--f-ko); font-weight:800; font-size:46px;
  color:var(--vellum); letter-spacing:-.01em; line-height:1;
}
.atlas-title .sep{
  font-family:var(--f-en-display); font-size:36px; color:var(--gold-500);
  font-weight:400; line-height:1;
}
.atlas-title .chapter{
  font-family:var(--f-mono); font-size:13px; font-weight:500;
  letter-spacing:.28em; color:var(--gold-300);
  padding:8px 14px;
  border:1px solid var(--gold-500);
  background-color:rgba(0,0,0,.4);
  position:relative;
  text-transform:uppercase;
}
.atlas-title .chapter > span.cap{
  position:absolute; width:5px; height:5px; border:1px solid var(--gold-300);
}
.atlas-title .chapter > span.cap.tl{ top:-1px; left:-1px; border-right:0; border-bottom:0; }
.atlas-title .chapter > span.cap.br{ bottom:-1px; right:-1px; border-left:0; border-top:0; }
.atlas-title .place{
  font-family:var(--f-ko); font-weight:700; font-size:38px;
  color:var(--gold-100); letter-spacing:.02em; line-height:1;
}

.header-spacer{ flex:1; }

.close-btn{
  width:60px; height:60px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background-color:var(--bg-2);
  border:1px solid var(--gold-500);
  color:var(--gold-200); cursor:pointer;
  position:relative; padding:0;
}
.close-btn .cap{
  position:absolute; width:7px; height:7px;
  border:1px solid var(--gold-300);
}
.close-btn .cap.tl{ top:-1px; left:-1px; border-right:0; border-bottom:0; }
.close-btn .cap.tr{ top:-1px; right:-1px; border-left:0; border-bottom:0; }
.close-btn .cap.bl{ bottom:-1px; left:-1px; border-right:0; border-top:0; }
.close-btn .cap.br{ bottom:-1px; right:-1px; border-left:0; border-top:0; }
.close-btn svg{ width:22px; height:22px; }
.close-btn:hover{ background-color:var(--bg-3); color:var(--gold-100); }

/* === BODY ROW ============================================== */
.atlas-body{
  flex:1;
  display:flex; flex-direction:row;
  min-height:0;
}

/* --- LEFT: MAP + SITE TRACK --- */
.atlas-left{
  flex:1;
  display:flex; flex-direction:column;
  border-right:1px solid var(--gold-500);
  position:relative;
  min-width:0;
}

.map-area{
  flex:1;
  position:relative;
  background-color:#080a18;
  overflow:hidden;
}
.map-backdrop{ position:absolute; inset:0; }
.map-backdrop svg{ width:100%; height:100%; display:block; }
.node-graph{ position:absolute; inset:0; pointer-events:none; }
.node-graph svg{ width:100%; height:100%; display:block; }

/* node buttons absolutely positioned by inline left/top */
.node{
  position:absolute;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:0; padding:0; cursor:pointer;
  width:88px; height:88px;
  margin-left:-44px; margin-top:-44px;
}
.node-disc{
  width:64px; height:64px;
  border-radius:32px;
  display:flex; align-items:center; justify-content:center;
  position:relative;
  background-color:#1a1f3a;
  border:2px solid var(--state-locked);
}
.node-disc-inner{
  width:54px; height:54px;
  border-radius:27px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(255,255,255,.06);
}
.node-icon{ width:32px; height:32px; color:var(--ink-3); }

/* state: cleared */
.node.is-cleared .node-disc{
  background-color:var(--state-safe-deep);
  border-color:var(--state-safe);
}
.node.is-cleared .node-disc-inner{ border-color:rgba(109,191,120,.45); }
.node.is-cleared .node-icon{ color:var(--state-safe); width:34px; height:34px; }

/* state: locked */
.node.is-locked .node-disc{
  background-color:var(--state-locked-deep);
  border-color:var(--state-locked);
}
.node.is-locked .node-disc-inner{ border-color:rgba(90,98,128,.4); }
.node.is-locked .node-icon{ color:#7a82a0; }

/* state: future (unlocked but not chosen) */
.node.is-future .node-disc{
  background-color:#15193a;
  border-color:var(--gold-400);
}
.node.is-future .node-disc-inner{ border-color:rgba(230,183,81,.4); }
.node.is-future .node-icon{ color:var(--gold-200); }

/* state: current — large w/ outer glow ring */
.node.is-current{
  width:148px; height:148px;
  margin-left:-74px; margin-top:-74px;
}
.node.is-current .node-disc{
  width:112px; height:112px;
  border-radius:56px;
  background-color:#2c1e08;
  border:2px solid var(--gold-100);
}
.node.is-current .node-disc-inner{
  width:98px; height:98px;
  border-radius:49px;
  background-color:#1a1206;
  border:1px solid var(--gold-300);
}
.node.is-current .node-icon{ width:54px; height:54px; color:var(--gold-100); }
.node.is-current .glow-ring{
  position:absolute;
  width:140px; height:140px; border-radius:70px;
  border:1px solid var(--gold-400);
}
.node.is-current .glow-ring-2{
  position:absolute;
  width:128px; height:128px; border-radius:64px;
  border:1px solid var(--gold-500);
}

/* state: boss — ornate compass */
.node.is-boss{
  width:148px; height:148px;
  margin-left:-74px; margin-top:-74px;
}
.node.is-boss .node-disc{
  width:128px; height:128px; border-radius:64px;
  background-color:transparent;
  border:1px solid var(--gold-500);
}
.node.is-boss .node-disc-inner{
  width:118px; height:118px; border-radius:59px;
  border:1px solid rgba(230,183,81,.3);
}
.node.is-boss .node-icon{ width:96px; height:96px; color:var(--gold-200); }

.node:hover .node-disc{ background-color:var(--bg-3); }
.node.is-current:hover .node-disc{ background-color:#3a2810; }
.node.is-locked{ cursor:not-allowed; }

/* boss + current node label below the disc */
.node-label{
  position:absolute;
  left:50%; bottom:-2px;
  margin-left:-80px; width:160px;
  text-align:center;
  font-family:var(--f-ko); font-weight:800; font-size:14px;
  color:var(--gold-100); letter-spacing:.04em;
  text-transform:none;
  background-color:rgba(0,0,0,.7);
  padding:3px 0;
  border:1px solid var(--gold-500);
}

/* === SITE TRACK ============================================ */
.site-track{
  flex-shrink:0;
  display:flex; align-items:center;
  height:108px;
  padding:0 56px;
  background-color:var(--bg-1);
  border-top:1px solid var(--gold-500);
  position:relative;
  gap:36px;
}
.site-track-rule{
  position:absolute; left:18px; right:18px; top:-4px;
  height:1px; background-color:var(--gold-300);
}
.site-track-label{
  font-family:var(--f-mono); font-weight:500;
  font-size:15px; letter-spacing:.32em;
  color:var(--gold-300); text-transform:uppercase;
  flex-shrink:0;
}
.site-track-bar{
  flex:1;
  display:flex; align-items:center;
  position:relative;
  height:64px;
}
.site-track-line{
  position:absolute; left:30px; right:30px;
  top:50%; height:2px; margin-top:-1px;
  background-color:var(--gold-500);
}
.segment{
  width:56px; height:56px; border-radius:28px;
  display:flex; align-items:center; justify-content:center;
  background-color:var(--bg-2);
  border:2px solid var(--state-locked);
  position:relative; z-index:1; flex-shrink:0;
}
.segment.is-cleared{
  background-color:var(--state-safe-deep);
  border-color:var(--state-safe);
}
.segment.is-cleared svg{ color:var(--state-safe); width:26px; height:26px; }
.segment.is-current{
  width:72px; height:72px; border-radius:36px;
  border:2px solid var(--gold-100);
  background-color:#1a1206;
  font-family:var(--f-en-display); font-weight:700; font-size:15px;
  letter-spacing:.18em; color:var(--gold-100);
}
.segment.is-current .seg-inner{
  width:60px; height:60px; border-radius:30px;
  border:1px solid var(--gold-300);
  display:flex; align-items:center; justify-content:center;
}
.segment.is-future{
  background-color:var(--bg-2);
  border-color:var(--gold-500);
}
.segment-spacer{ flex:1; }

/* === RIGHT PANEL =========================================== */
.atlas-right{
  width:560px; flex-shrink:0;
  background-color:var(--bg-1);
  display:flex; flex-direction:column;
  padding:36px 36px 32px 36px;
  position:relative;
}
.atlas-right .cap{
  position:absolute; width:14px; height:14px;
  border:1px solid var(--gold-300);
}
.atlas-right .cap.tl{ top:-1px; left:-1px; border-right:0; border-bottom:0; }
.atlas-right .cap.tr{ top:-1px; right:-1px; border-left:0; border-bottom:0; }
.atlas-right .cap.bl{ bottom:-1px; left:-1px; border-right:0; border-top:0; }
.atlas-right .cap.br{ bottom:-1px; right:-1px; border-left:0; border-top:0; }

.site-header{
  display:flex; align-items:center; gap:14px;
  padding-bottom:4px;
}
.pin-icon{
  width:42px; height:42px;
  color:var(--gold-300); flex-shrink:0;
}
.site-name{
  font-family:var(--f-ko); font-weight:800; font-size:44px;
  color:var(--vellum); letter-spacing:-.01em; line-height:1.05;
}

.encounter-row{
  display:flex; align-items:center; gap:14px;
  font-family:var(--f-ko); font-size:19px;
  color:var(--ink-2);
  margin-top:14px; padding-bottom:22px;
  border-bottom:1px solid var(--line-2);
}
.encounter-row .kicker{
  font-family:var(--f-mono); font-weight:500;
  font-size:13px; letter-spacing:.18em;
  color:var(--gold-300); text-transform:uppercase;
}
.encounter-row .dash{ color:var(--gold-500); }
.encounter-row b{ color:var(--vellum); font-weight:800; }

.section-h{
  display:flex; align-items:baseline; gap:12px;
  font-family:var(--f-ko); font-weight:700; font-size:18px;
  color:var(--ink-2);
  margin-top:26px; margin-bottom:14px;
}
.section-h .en{
  font-family:var(--f-mono); font-weight:500; font-size:11px;
  letter-spacing:.22em; color:var(--gold-500); text-transform:uppercase;
}

/* reward chips */
.reward-row{ display:flex; gap:14px; }
.reward-chip{
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:16px 10px 14px 10px;
  background-color:var(--bg-2);
  border:1px solid var(--gold-500);
  position:relative;
}
.reward-chip .cap{
  position:absolute; width:8px; height:8px;
  border:1px solid var(--gold-300);
}
.reward-chip .cap.tl{ top:-1px; left:-1px; border-right:0; border-bottom:0; }
.reward-chip .cap.br{ bottom:-1px; right:-1px; border-left:0; border-top:0; }
.reward-icon{
  width:48px; height:48px;
  display:flex; align-items:center; justify-content:center;
  margin-bottom:8px;
}
.reward-label{
  font-family:var(--f-ko); font-weight:700; font-size:15px;
  color:var(--ink-2); letter-spacing:.04em;
}
.reward-value{
  font-family:var(--f-en-display); font-weight:700; font-size:32px;
  color:var(--gold-100); margin-top:4px; line-height:1;
  letter-spacing:.04em;
}

/* threat chips */
.threat-row{ display:flex; gap:12px; flex-wrap:wrap; }
.threat-chip{
  display:flex; align-items:center; gap:10px;
  padding:10px 18px;
  background-color:rgba(182,51,74,.14);
  border:1px solid var(--state-injured);
  color:var(--state-danger);
  font-family:var(--f-ko); font-weight:700; font-size:17px;
  letter-spacing:.01em;
  position:relative;
}
.threat-chip .cap{
  position:absolute; width:5px; height:5px;
  border:1px solid var(--state-injured);
}
.threat-chip .cap.tl{ top:-1px; left:-1px; border-right:0; border-bottom:0; }
.threat-chip .cap.br{ bottom:-1px; right:-1px; border-left:0; border-top:0; }
.threat-chip svg{ width:20px; height:20px; }

/* hint */
.hint-row{
  display:flex; align-items:center; gap:14px;
  padding:14px 18px;
  background-color:rgba(91,142,209,.08);
  border:1px solid var(--rare-rare);
  border-left:3px solid var(--rare-rare-glow);
  font-family:var(--f-ko); font-size:17px;
  color:var(--ink-1);
}
.hint-row svg{ width:26px; height:26px; color:var(--rare-rare-glow); flex-shrink:0; }
.hint-row b{ color:var(--gold-200); font-weight:800; }

/* spacer pushes CTAs to bottom */
.right-spacer{ flex:1; min-height:24px; }

/* CTA row */
.cta-row{ display:flex; gap:14px; }
.cta{
  flex:1; min-height:80px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:0; cursor:pointer;
  position:relative;
  font-family:var(--f-ko);
  border:1px solid var(--gold-500);
}
.cta .cta-inner{
  position:absolute; left:4px; right:4px; top:4px; bottom:4px;
  border:1px solid var(--gold-300);
  pointer-events:none;
}
.cta .cap{
  position:absolute; width:8px; height:8px;
  border:1px solid var(--gold-100); z-index:2;
}
.cta .cap.tl{ top:-1px; left:-1px; border-right:0; border-bottom:0; }
.cta .cap.tr{ top:-1px; right:-1px; border-left:0; border-bottom:0; }
.cta .cap.bl{ bottom:-1px; left:-1px; border-right:0; border-top:0; }
.cta .cap.br{ bottom:-1px; right:-1px; border-left:0; border-top:0; }
.cta-label{
  position:relative; z-index:1;
  font-weight:800; line-height:1;
}
.cta-sub{
  position:relative; z-index:1;
  font-family:var(--f-mono); font-weight:500;
  font-size:13px; letter-spacing:.16em;
  margin-top:5px;
  text-transform:uppercase;
}

.cta-primary{
  background-color:var(--gold-400);
}
.cta-primary .cta-inner{ border-color:var(--gold-100); }
.cta-primary .cta-label{ color:#1a1206; font-size:28px; letter-spacing:.06em; }
.cta-primary .cta-sub{ color:#5a4210; }
.cta-primary:hover{ background-color:var(--gold-300); }

.cta-secondary{
  background-color:var(--bg-2);
}
.cta-secondary .cta-inner{ border-color:var(--gold-500); }
.cta-secondary .cta-label{ color:var(--vellum); font-size:22px; letter-spacing:.04em; }
.cta-secondary .cta-sub{ color:var(--rare-rare-glow); font-weight:700; }
.cta-secondary .cap{ border-color:var(--gold-300); }
.cta-secondary:hover{ background-color:var(--bg-3); }

/* === FOOTER ================================================= */
.atlas-footer{
  flex-shrink:0; height:104px;
  display:flex; align-items:center;
  padding:0 36px;
  background-color:var(--bg-1);
  border-top:1px solid var(--gold-500);
  position:relative;
}
.footer-rule{
  position:absolute; left:18px; right:18px; top:-4px;
  height:1px; background-color:var(--gold-300);
}
.back-btn{
  display:flex; align-items:center; gap:14px;
  padding:16px 32px;
  background-color:var(--bg-2);
  border:1px solid var(--gold-500);
  color:var(--ink-1);
  font-family:var(--f-ko); font-weight:700; font-size:20px;
  cursor:pointer;
  position:relative;
}
.back-btn .cap{
  position:absolute; width:8px; height:8px;
  border:1px solid var(--gold-300);
}
.back-btn .cap.tl{ top:-1px; left:-1px; border-right:0; border-bottom:0; }
.back-btn .cap.br{ bottom:-1px; right:-1px; border-left:0; border-top:0; }
.back-btn svg{ width:22px; height:22px; color:var(--gold-200); }
.back-btn:hover{ background-color:var(--bg-3); color:var(--vellum); }

.footer-spacer{ flex:1; }
.progress-block{
  display:flex; align-items:baseline; gap:16px;
  font-family:var(--f-ko); font-weight:700; font-size:19px;
  color:var(--ink-2); letter-spacing:.04em;
}
.progress-block .progress-num{
  font-family:var(--f-en-display); font-weight:700;
  font-size:42px; color:var(--gold-100); letter-spacing:.06em;
  line-height:1;
}
.progress-block .progress-slash{
  font-family:var(--f-en-display);
  color:var(--gold-500); font-size:30px; font-weight:400;
}
.progress-block .progress-total{
  font-family:var(--f-en-display); font-weight:700;
  font-size:32px; color:var(--ink-3); letter-spacing:.04em;
  line-height:1;
}

</style>
</head>
<body>

<div class="atlas" data-screen-label="Atlas — 원정 지도">

  <!-- =================== HEADER =================== -->
  <header class="atlas-header">
    <div class="header-rule"></div>

    <div class="compass-frame">
      <!-- Ornate compass rose -->
      <svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="1.2">
        <defs>
          <linearGradient id="compass-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffe9a8"/>
            <stop offset="60%" stop-color="#e6b751"/>
            <stop offset="100%" stop-color="#8a6418"/>
          </linearGradient>
        </defs>
        <!-- outer ornamental ring -->
        <circle cx="36" cy="36" r="34" stroke="#8a6418" stroke-width="1"/>
        <circle cx="36" cy="36" r="30" stroke="#e6b751" stroke-width=".8"/>
        <!-- 8 tick marks -->
        <g stroke="#e6b751" stroke-width="1">
          <line x1="36" y1="6" x2="36" y2="12"/>
          <line x1="36" y1="60" x2="36" y2="66"/>
          <line x1="6" y1="36" x2="12" y2="36"/>
          <line x1="60" y1="36" x2="66" y2="36"/>
          <line x1="15" y1="15" x2="19" y2="19" opacity=".6"/>
          <line x1="53" y1="53" x2="57" y2="57" opacity=".6"/>
          <line x1="57" y1="15" x2="53" y2="19" opacity=".6"/>
          <line x1="19" y1="53" x2="15" y2="57" opacity=".6"/>

              <defs>
                <linearGradient id="bossg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ffe9a8"/>
                  <stop offset="60%" stop-color="#e6b751"/>
                  <stop offset="100%" stop-color="#8a6418"/>
                </linearGradient>
              </defs>
              <!-- outer rays -->
              <g stroke="#c8932a" stroke-width="1" opacity=".7">
                <line x1="48" y1="2" x2="48" y2="14"/>
                <line x1="48" y1="82" x2="48" y2="94"/>
                <line x1="2" y1="48" x2="14" y2="48"/>
                <line x1="82" y1="48" x2="94" y2="48"/>
                <line x1="16" y1="16" x2="22" y2="22"/>
                <line x1="74" y1="74" x2="80" y2="80"/>
                <line x1="80" y1="16" x2="74" y2="22"/>
                <line x1="22" y1="74" x2="16" y2="80"/>
              </g>
              <!-- main 4-point star -->
              <polygon points="48,12 54,46 88,48 54,50 48,84 42,50 8,48 42,46" fill="url(#bossg)" stroke="#5a4210" stroke-width="1"/>
              <!-- diagonal smaller star -->
              <polygon points="48,22 51,46 72,48 51,50 48,74 45,50 24,48 45,46" fill="#e6b751" opacity=".6"/>
              <!-- crossed blades -->
              <line x1="22" y1="22" x2="74" y2="74" stroke="#8a6418" stroke-width="1.5" opacity=".55"/>
              <line x1="74" y1="22" x2="22" y2="74" stroke="#8a6418" stroke-width="1.5" opacity=".55"/>
              <!-- center gem -->
              <circle cx="48" cy="48" r="6" fill="#1a1206" stroke="#ffe9a8" stroke-width="1"/>
              <circle cx="48" cy="48" r="3" fill="#ffe9a8"/>
              <circle cx="46.5" cy="46.5" r="1" fill="#fff"/>
            </svg>
          </div></div>
        </button>

      </div><!-- /.map-area -->

      <!-- SITE TRACK -->
      <div class="site-track">
        <div class="site-track-rule"></div>
        <div class="site-track-label">SITE TRACK</div>
        <div class="site-track-bar">
          <div class="site-track-line"></div>
          <div class="segment is-cleared">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="5,12 10,17 19,7"/>
            </svg>
          </div>
          <div class="segment-spacer"></div>
          <div class="segment is-cleared">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="5,12 10,17 19,7"/>
            </svg>
          </div>
          <div class="segment-spacer"></div>
          <div class="segment is-current">
            <div class="seg-inner">NOW</div>
          </div>
          <div class="segment-spacer"></div>
          <div class="segment is-future"></div>
          <div class="segment-spacer"></div>
          <div class="segment is-future"></div>
        </div>
      </div>
    </div><!-- /.atlas-left -->

    <!-- ===== RIGHT PANEL ===== -->
    <aside class="atlas-right">
      <span class="cap tl"></span>
      <span class="cap tr"></span>
      <span class="cap bl"></span>
      <span class="cap br"></span>

      <div class="site-header">
        <svg class="pin-icon" viewBox="0 0 42 42" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <path d="M21,4 C13.3,4 7,10.3 7,18 C7,28 21,38 21,38 C21,38 35,28 35,18 C35,10.3 28.7,4 21,4 Z" fill="rgba(230,183,81,.15)"/>
          <circle cx="21" cy="17" r="5" fill="rgba(0,0,0,.45)" stroke="currentColor"/>
        </svg>
        <h2 class="site-name">늦지 척후소</h2>
      </div>

      <div class="encounter-row">
        <span class="kicker">Encounter</span>
        <span class="dash">—</span>
        <span>적 척후 <b>4</b>기 <span class="dash">+</span> 두목 <b>1</b></span>
      </div>

      <div class="section-h">
        기대 보상 <span class="en">Expected Rewards</span>
      </div>
      <div class="reward-row">
        <div class="reward-chip">
          <span class="cap tl"></span><span class="cap br"></span>
          <div class="reward-icon">
            <!-- gold coin -->
            <svg viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="20" fill="#c8932a" stroke="#5a4210" stroke-width="1.5"/>
              <circle cx="24" cy="24" r="16" fill="none" stroke="#ffe9a8" stroke-width=".8"/>
              <!-- inner star -->
              <polygon points="24,12 27,22 37,22 29,28 32,38 24,32 16,38 19,28 11,22 21,22" fill="#ffe9a8" stroke="#5a4210" stroke-width=".5"/>
              <circle cx="24" cy="25" r="1.5" fill="#5a4210"/>
              <!-- highlight glint -->
              <ellipse cx="17" cy="16" rx="3" ry="1.5" fill="#fff8e0" opacity=".55"/>
            </svg>
          </div>
          <div class="reward-label">골드</div>
          <div class="reward-value">25</div>
        </div>
        <div class="reward-chip">
          <span class="cap tl"></span><span class="cap br"></span>
          <div class="reward-icon">
            <!-- echo crystal -->
            <svg viewBox="0 0 48 48" fill="none">
              <defs>
                <linearGradient id="echo-g" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#d4b4f0"/>
                  <stop offset="55%" stop-color="#5b8ed1"/>
                  <stop offset="100%" stop-color="#1f3b66"/>
                </linearGradient>
              </defs>
              <polygon points="24,4 36,18 30,42 18,42 12,18" fill="url(#echo-g)" stroke="#1f3b66" stroke-width="1"/>
              <polygon points="24,4 30,18 24,42 18,18" fill="#9bbeed" opacity=".6"/>
              <line x1="24" y1="4" x2="24" y2="42" stroke="#fff" opacity=".4" stroke-width=".7"/>
              <polygon points="12,18 36,18 30,22 18,22" fill="#1f3b66" opacity=".5"/>
              <polygon points="20,8 22,7 22,14 20,15" fill="#fff" opacity=".5"/>
            </svg>
          </div>
          <div class="reward-label">잔향</div>
          <div class="reward-value">8</div>
        </div>
        <div class="reward-chip">
          <span class="cap tl"></span><span class="cap br"></span>
          <div class="reward-icon">
            <!-- equip card -->
            <svg viewBox="0 0 48 48" fill="none">
              <rect x="11" y="5" width="26" height="38" fill="#2c1e08" stroke="#c8932a" stroke-width="1.5"/>
              <rect x="13" y="7" width="22" height="34" fill="none" stroke="#e6b751" stroke-width=".7"/>
              <!-- card rib top -->
              <rect x="13" y="8" width="22" height="3" fill="#c8932a"/>
              <!-- center gem -->
              <polygon points="24,16 30,22 24,34 18,22" fill="#b561d6" stroke="#ffe9a8" stroke-width=".7"/>
              <polygon points="24,16 27,22 24,34 21,22" fill="#f08a3c" opacity=".75"/>
              <!-- corner accents -->
              <circle cx="13" cy="8" r="1.2" fill="#ffe9a8"/>
              <circle cx="35" cy="8" r="1.2" fill="#ffe9a8"/>
              <circle cx="13" cy="41" r="1.2" fill="#ffe9a8"/>
              <circle cx="35" cy="41" r="1.2" fill="#ffe9a8"/>
              <!-- bottom rune -->
              <line x1="17" y1="38" x2="31" y2="38" stroke="#e6b751" stroke-width=".7"/>
            </svg>
          </div>
          <div class="reward-label">장비 카드</div>
          <div class="reward-value">1</div>
        </div>
      </div>

      <div class="section-h">
        적 주요 위협 <span class="en">Key Threats</span>
      </div>
      <div class="threat-row">
        <div class="threat-chip">
          <span class="cap tl"></span><span class="cap br"></span>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="16" x2="16" y2="4"/>
            <polyline points="9,4 16,4 16,11"/>
          </svg>
          <span>회피 측면</span>
        </div>
        <div class="threat-chip">
          <span class="cap tl"></span><span class="cap br"></span>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="10" cy="10" r="7"/>
            <circle cx="10" cy="10" r="3"/>
            <line x1="10" y1="1" x2="10" y2="5"/>
            <line x1="10" y1="15" x2="10" y2="19"/>
            <line x1="1" y1="10" x2="5" y2="10"/>
            <line x1="15" y1="10" x2="19" y2="10"/>
          </svg>
          <span>사격</span>
        </div>
      </div>

      <div class="section-h">
        원정 힌트 <span class="en">Expedition Hint</span>
      </div>
      <div class="hint-row">
        <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2,13 C5,7 8.5,4.5 13,4.5 C17.5,4.5 21,7 24,13 C21,19 17.5,21.5 13,21.5 C8.5,21.5 5,19 2,13 Z"/>
          <circle cx="13" cy="13" r="3.5" fill="currentColor" fill-opacity=".25"/>
          <circle cx="13" cy="13" r="1.4" fill="currentColor"/>
        </svg>
        <span><b>정찰 가능</b> — 두목 약점 + 기물 1</span>
      </div>

      <div class="right-spacer"></div>

      <!-- CTAs -->
      <div class="cta-row">
        <button class="cta cta-primary" type="button" name="AtlasSortieButton">
          <span class="cap tl"></span><span class="cap tr"></span>
          <span class="cap bl"></span><span class="cap br"></span>
          <span class="cta-inner"></span>
          <span class="cta-label">출정</span>
          <span class="cta-sub">SORTIE</span>
        </button>
        <button class="cta cta-secondary" type="button" name="AtlasScoutButton">
          <span class="cap tl"></span><span class="cap tr"></span>
          <span class="cap bl"></span><span class="cap br"></span>
          <span class="cta-inner"></span>
          <span class="cta-label">정찰</span>
          <span class="cta-sub">−35 잔향</span>
        </button>
      </div>
    </aside><!-- /.atlas-right -->
  </div><!-- /.atlas-body -->

  <!-- =================== FOOTER =================== -->
  <footer class="atlas-footer">
    <div class="footer-rule"></div>
    <button class="back-btn" type="button" name="AtlasReturnToTownButton">
      <span class="cap tl"></span>
      <span class="cap br"></span>
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="13,4 5,11 13,18"/>
        <line x1="5" y1="11" x2="20" y2="11"/>
      </svg>
      <span>마을 복귀</span>
    </button>
    <div class="footer-spacer"></div>
    <div class="progress-block">
      <span>원정 진행도</span>
      <span class="progress-num">3</span>
      <span class="progress-slash">/</span>
      <span class="progress-total">5</span>
    </div>
  </footer>

</div>
</body>
</html>
