/* ===========================================================
   BOARD SVG — rings + ornament + connection lines
   =========================================================== */
function BoardSvg({ nodes, selectedId, showGuides, ringDensity }) {
  const nodeById = useMemo(() => Object.fromEntries(nodes.map(n => [n.id, n])), [nodes]);
  const isActive = (n) => n && n.rank > 0;

  // small dot ornaments around outer perimeter
  const ornamentDots = useMemo(() => {
    if (ringDensity === "minimal") return [];
    const count = ringDensity === "rich" ? 60 : 32;
    const arr = [];
    for (let i = 0; i < count; i++) {
      const a = (i / count) * 360;
      const p = posOf(a, R_OUTER + 38);
      arr.push({ x: p.x, y: p.y, big: i % 8 === 0 });
    }
    return arr;
  }, [ringDensity]);

  // mid decorative arcs (small star marks around inner ring)
  const innerOrnaments = useMemo(() => {
    if (ringDensity === "minimal") return [];
    const arr = [];
    const count = 8;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * 360 + 22.5;
      const p = posOf(a, R_INNER + 70);
      arr.push({ x: p.x, y: p.y });
    }
    return arr;
  }, [ringDensity]);

  return (
    <svg className="board-svg" viewBox="0 0 720 720">
      {/* outer ornament ring (dotted decoration) */}
      <circle cx={CX} cy={CY} r={R_OUTER + 56} fill="none" stroke="#3a4c84" strokeWidth="0.7" opacity={showGuides ? 0.45 : 0} />
      <circle cx={CX} cy={CY} r={R_OUTER + 40} fill="none" stroke="#3a4c84" strokeWidth="0.5" opacity={showGuides ? 0.30 : 0} />
      {ornamentDots.map((d, i) => (
        <circle key={i} cx={d.x} cy={d.y} r={d.big ? 1.6 : 0.9} fill="#c8932a" opacity={d.big ? 0.7 : 0.35} />
      ))}

      {/* outer ring base (dim) */}
      <circle cx={CX} cy={CY} r={R_OUTER} fill="none" stroke="#8a6418" strokeWidth="1.5" opacity="0.55" />
      <circle cx={CX} cy={CY} r={R_OUTER} fill="none" stroke="#c8932a" strokeWidth="0.6" opacity="0.35" />

      {/* outer ring activated arcs — bright gold between activated nodes */}
      {EDGES.filter(([a,b]) => {
        const A = nodeById[a], B = nodeById[b];
        return A?.ring === "outer" && B?.ring === "outer" && isActive(A) && isActive(B);
      }).map(([a,b], i) => {
        const A = nodeById[a], B = nodeById[b];
        const pa = posOf(A.angle, R_OUTER);
        const pb = posOf(B.angle, R_OUTER);
        // arc between two outer points along the outer ring
        const largeArc = 0;
        const sweep = ((B.angle - A.angle + 360) % 360) > 180 ? 0 : 1;
        return (
          <g key={"arc-"+i}>
            <path d={`M${pa.x},${pa.y} A${R_OUTER},${R_OUTER} 0 ${largeArc},${sweep} ${pb.x},${pb.y}`}
                  fill="none" stroke="#f5d68a" strokeWidth="3" opacity=".95" />
            <path d={`M${pa.x},${pa.y} A${R_OUTER},${R_OUTER} 0 ${largeArc},${sweep} ${pb.x},${pb.y}`}
                  fill="none" stroke="#ffe9a8" strokeWidth="1" opacity=".9" />
            {/* glow halo via thicker faint stroke */}
            <path d={`M${pa.x},${pa.y} A${R_OUTER},${R_OUTER} 0 ${largeArc},${sweep} ${pb.x},${pb.y}`}
                  fill="none" stroke="#f5d68a" strokeWidth="8" opacity=".18" />
          </g>
        );
      })}

      {/* inner ring base */}
      <circle cx={CX} cy={CY} r={R_INNER} fill="none" stroke="#8a6418" strokeWidth="1.2" opacity="0.4" />
      <circle cx={CX} cy={CY} r={R_INNER} fill="none" stroke="#c8932a" strokeWidth="0.5" opacity="0.25" />

      {/* radial spokes — bright when both endpoints active */}
      {EDGES.filter(([a,b]) => {
        const A = nodeById[a], B = nodeById[b];
        return A && B && !(A.ring === "outer" && B.ring === "outer");
      }).map(([a,b], i) => {
        const A = nodeById[a], B = nodeById[b];
        const rA = A.ring === "outer" ? R_OUTER : R_INNER;
        const rB = B.ring === "outer" ? R_OUTER : R_INNER;
        const pa = posOf(A.angle, rA);
        const pb = posOf(B.angle, rB);
        const bright = isActive(A) && isActive(B);
        return (
          <g key={"sp-"+i}>
            {bright && (
              <line x1={pa.x} y1={pa.y} x2={pb.x} y2={pb.y}
                    stroke="#f5d68a" strokeWidth="7" opacity=".18" />
            )}
            <line x1={pa.x} y1={pa.y} x2={pb.x} y2={pb.y}
                  stroke={bright ? "#f5d68a" : "#3a4c84"}
                  strokeWidth={bright ? 2.4 : 1.2}
                  opacity={bright ? .95 : .35} />
            {bright && (
              <line x1={pa.x} y1={pa.y} x2={pb.x} y2={pb.y}
                    stroke="#ffe9a8" strokeWidth=".8" opacity=".85" />
            )}
          </g>
        );
      })}

      {/* inner ring ornament marks */}
      {innerOrnaments.map((d, i) => (
        <g key={i} opacity="0.55">
          <path d={`M${d.x} ${d.y-3} L${d.x+1} ${d.y-1} L${d.x+3} ${d.y} L${d.x+1} ${d.y+1} L${d.x} ${d.y+3} L${d.x-1} ${d.y+1} L${d.x-3} ${d.y} L${d.x-1} ${d.y-1} Z`}
                fill="#c8932a"/>
        </g>
      ))}

      {/* faint inner concentric guide circles */}
      {showGuides && (
        <>
          <circle cx={CX} cy={CY} r={200} fill="none" stroke="#3a4c84" strokeWidth=".5" opacity=".25" />
          <circle cx={CX} cy={CY} r={75} fill="none" stroke="#3a4c84" strokeWidth=".5" opacity=".25" />
        </>
      )}

      {/* north star marker at very top of outer ring */}
      <g opacity="0.7">
        <path d={`M${CX} ${CY - R_OUTER - 20} L${CX+3} ${CY - R_OUTER - 8} L${CX} ${CY - R_OUTER - 4} L${CX-3} ${CY - R_OUTER - 8} Z`} fill="#e6b751"/>
      </g>
    </svg>
  );
}

/* ===========================================================
   NODE BUTTON
   =========================================================== */
function NodeButton({ node, selected, onClick }) {
  const r = node.ring === "outer" ? R_OUTER : R_INNER;
  const p = posOf(node.angle, r);
  const Icon = I[node.icon] || I.Star;
  const isLock = !!node.locked;
  const isActive = node.rank > 0;
  const isAvail = !isLock && !isActive;

  let state = "is-locked";
  if (isLock) state = "is-locked";
  else if (selected) state = "is-selected";
  else if (isActive) state = "is-active";
  else if (isAvail) state = "is-avail";

  const sizeCls = node.ring === "inner" ? "size-sm" : "";

  return (
    <button
      type="button"
      name={`PbpNode_${node.id}`}
      className={`node ${state} ${sizeCls}`}
      style={{ left: p.x, top: p.y }}
      onClick={() => onClick(node.id)}
      aria-label={node.name}
    >
      {/* fake glow rings — solid borders, opacity-stacked */}
      <span className="node-glow ring-3" aria-hidden="true"></span>
      <span className="node-glow ring-2" aria-hidden="true"></span>
      <span className="node-glow ring-1" aria-hidden="true"></span>
      <Icon className="node-icon" />
      {/* rank pips */}
      {!isLock && (
        <span className="node-rank" aria-hidden="true">
          {Array.from({ length: node.max }).map((_, i) => (
            <i key={i} className={i < node.rank ? "on" : ""}></i>
          ))}
        </span>
      )}
    </button>
  );
}

/* ===========================================================
   DETAIL CARD (right rail)
   =========================================================== */
function DetailCard({ node, nodeById, onActivate, points }) {
  if (!node) return null;
  const isLock = !!node.locked;
  const isMaxed = node.rank >= node.max;
  const reqs = (node.req || []).map(rid => {
    const r = nodeById[rid];
    return { id: rid, name: r ? r.name : rid, ok: r ? r.rank > 0 : false };
  });
  const allReqsOk = reqs.every(r => r.ok);
  const canActivate = !isLock && !isMaxed && allReqsOk && points > 0;
  const Icon = I[node.icon] || I.Star;

  return (
    <div className="detail-card">
      <span className="cc tl"></span><span className="cc tr"></span>
      <span className="cc bl"></span><span className="cc br"></span>

      <div className={`dc-icon-wrap ${isLock ? "locked" : ""}`}>
        <span className="glow-3" aria-hidden="true"></span>
        <span className="glow-2" aria-hidden="true"></span>
        <span className="glow-1" aria-hidden="true"></span>
        <Icon className="dc-icon" />
      </div>

      <h2 className="dc-name">{node.name}</h2>
      <div className="dc-rank-pill">
        <span className="cc tl"></span><span className="cc br"></span>
        <span className="cur">{node.rank}</span>
        <span>/</span>
        <span className="max">{node.max}</span>
      </div>

      <div className="dc-divider"></div>

      <div className="dc-stats">
        {node.stats.map((s, i) => (
          <div className="dc-stat" key={i}>
            <span className="k">{s.k}</span>
            <span className={`v ${isLock ? "dim" : ""}`}>{s.v}</span>
          </div>
        ))}
        <div className="dc-stat cost">
          <span className="k">소요 패시브 포인트</span>
          <span className="v">{node.cost}</span>
        </div>
      </div>

      <div className="dc-divider"></div>

      {reqs.length === 0 ? (
        <div className="dc-req ok">
          <I.Check className="icon" />
          <span>선행 노드 없음</span>
        </div>
      ) : (
        reqs.map(r => (
          <div className={`dc-req ${r.ok ? "ok" : "miss"}`} key={r.id}>
            {r.ok ? <I.Check className="icon" /> : <I.X className="icon" />}
            <span>{r.name} 활성화 {r.ok ? "완료" : "필요"}</span>
          </div>
        ))
      )}

      <div className="dc-actions">
        {isMaxed ? (
          <button
            type="button"
            name="PbpActivate"
            className="btn-activate is-maxed"
            disabled
          >
            <span className="label">최대 강화 완료</span>
          </button>
        ) : (
          <button
            type="button"
            name="PbpActivate"
            className={`btn-activate ${canActivate ? "" : "is-disabled"}`}
            onClick={canActivate ? () => onActivate(node.id) : undefined}
            disabled={!canActivate}
          >
            {canActivate && <span className="hi" aria-hidden="true"></span>}
            {canActivate && <span className="lo" aria-hidden="true"></span>}
            <span className="cc tl"></span><span className="cc tr"></span>
            <span className="cc bl"></span><span className="cc br"></span>
            <span className="label">{isLock ? "잠김" : "활성화"}</span>
          </button>
        )}
      </div>
    </div>
  );
}

/* ===========================================================
   TWEAKS PANEL — small floating control set
   =========================================================== */
function TweaksPanel({ tweaks, setTweak, onClose }) {
  const heroOptions = [
    ["reaper","리퍼"], ["striker","카에데"], ["vanguard","에리히"],
  ];
  const densityOptions = [
    ["minimal","미니멀"], ["normal","보통"], ["rich","풍성"],
  ];
  return (
    <div className="tweaks">
      <span className="cc tl"></span><span className="cc br"></span>
      <h3 className="tweaks-title">TWEAKS <span className="ko">조정</span></h3>

      <div className="tweak">
        <label className="lbl">HERO <span className="ko">영웅</span></label>
        <div className="tw-radio">
          {heroOptions.map(([v, lbl]) => (
            <button key={v}
              type="button"
              className={tweaks.hero === v ? "on" : ""}
              onClick={() => setTweak("hero", v)}>{lbl}</button>
          ))}
        </div>
      </div>

      <div className="tweak">
        <label className="lbl">ORNAMENT <span className="ko">장식 밀도</span></label>
        <div className="tw-radio">
          {densityOptions.map(([v, lbl]) => (
            <button key={v}
              type="button"
              className={tweaks.ringDensity === v ? "on" : ""}
              onClick={() => setTweak("ringDensity", v)}>{lbl}</button>
          ))}
        </div>
      </div>

      <div className="tweak">
        <label className="lbl">GUIDES <span className="ko">가이드 링</span></label>
        <div className="tw-radio">
          <button type="button" className={tweaks.showGuides ? "on" : ""} onClick={() => setTweak("showGuides", true)}>표시</button>
          <button type="button" className={!tweaks.showGuides ? "on" : ""} onClick={() => setTweak("showGuides", false)}>숨김</button>
        </div>
      </div>

      <button
        type="button"
        onClick={onClose}
        style={{
          marginTop:8, width:"100%", padding:"6px 0",
          background:"transparent", border:"1px solid #8a6418",
          color:"#d8c799", fontFamily:"var(--f-mono)", fontSize:10,
          letterSpacing:".18em", cursor:"pointer", textTransform:"uppercase"
        }}>닫기 / Close</button>
    </div>
  );
}

/* ===========================================================
   APP
   =========================================================== */
function App() {
  const [tweaks, setTweaks] = useState(TWEAKS);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [editAvailable, setEditAvailable] = useState(false);
  const [nodes, setNodes] = useState(NODES);
  const [selectedId, setSelectedId] = useState("n_crit");
  const [points, setPoints] = useState(3);
  const POINTS_MAX = 8;

  // total spent
  const spent = useMemo(() => nodes.reduce((s, n) => s + (n.rank * n.cost), 0), [nodes]);
  useEffect(() => {
    setPoints(POINTS_MAX - spent);
  }, [spent]);

  // host integration — tweaks visibility protocol
  useEffect(() => {
    const handler = (ev) => {
      if (!ev?.data) return;
      if (ev.data.type === "__activate_edit_mode") setTweaksOpen(true);
      else if (ev.data.type === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", handler);
    window.parent?.postMessage({ type: "__edit_mode_available" }, "*");
    setEditAvailable(true);
    return () => window.removeEventListener("message", handler);
  }, []);

  const setTweak = (k, v) => {
    setTweaks((t) => {
      const next = { ...t, [k]: v };
      window.parent?.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*");
      return next;
    });
  };

  const nodeById = useMemo(() => Object.fromEntries(nodes.map(n => [n.id, n])), [nodes]);
  const selected = nodeById[selectedId];

  const handleActivate = (id) => {
    setNodes((arr) => arr.map(n => {
      if (n.id !== id) return n;
      if (n.locked) return n;
      if (n.rank >= n.max) return n;
      const cost = n.cost;
      if (points < cost) return n;
      return { ...n, rank: n.rank + 1 };
    }));
  };

  const handleReset = () => {
    setNodes((arr) => arr.map(n => ({ ...n, rank: 0 })));
  };

  const hero = HEROES[tweaks.hero] || HEROES.reaper;
  const Silhouette = hero.Silhouette;

  return (
    <>
      <div className="pb-shell" data-screen-label="01 Passive Board">
        <span className="corner-cap tl"></span>
        <span className="corner-cap tr"></span>
        <span className="corner-cap bl"></span>
        <span className="corner-cap br"></span>
        <span className="pb-shell-inner"></span>

        <span className="pb-bgwash top-left"></span>
        <span className="pb-bgwash center"></span>
        <span className="pb-bgwash bot-right"></span>

        {/* TOP BAR */}
        <div className="pb-top">
          <span className="pb-top-divider"></span>
          <div className="pb-title-block">
            <h1 className="pb-title">
              패시브 보드<span className="sep">—</span><span className="who">{hero.name}</span>
            </h1>
          </div>

          <div className="pb-points-wrap">
            <div className="pb-points" name="PbpPointsDisplay">
              <span className="pp-corner tl"></span>
              <span className="pp-corner tr"></span>
              <span className="pp-corner bl"></span>
              <span className="pp-corner br"></span>
              <I.PointDiamond className="icon" />
              <span className="label">패시브 포인트</span>
              <span className="nums">
                <span className="cur">{points}</span>
                <span style={{margin:"0 4px", color:"#8a6418"}}>/</span>
                <span className="max">{POINTS_MAX}</span>
              </span>
            </div>
          </div>

          <button type="button" name="PbpClose" className="pb-close" aria-label="닫기">
            <span className="cc tl"></span><span className="cc br"></span>
            <I.X width="18" height="18" />
          </button>
        </div>

        {/* BODY */}
        <div className="pb-body">
          {/* LEFT — hero card */}
          <div className="pb-left">
            <div className="hero-card">
              <span className="cc tl"></span><span className="cc tr"></span>
              <span className="cc bl"></span><span className="cc br"></span>
              <span className="hero-card-inner"></span>

              <div className="hero-portrait">
                <div className="hp-bg">
                  <span className="layer-1" style={{ backgroundColor: hero.moodB }}></span>
                  <span className="layer-2" style={{ backgroundColor: hero.moodA }}></span>
                  <span className="layer-3"></span>
                  <span className="moon"></span>
                  <span className="moon-aura"></span>
                  {/* castle silhouette as svg */}
                  <svg style={{position:"absolute", left:0, right:0, bottom:"42%", width:"100%", height:"60px"}} viewBox="0 0 340 60" preserveAspectRatio="none">
                    <path d="M0 60 L0 38 L18 38 L18 28 L34 28 L34 14 L52 14 L52 28 L68 28 L68 22 L86 22 L86 36 L102 36 L102 18 L120 18 L120 30 L150 30 L150 22 L168 22 L168 14 L184 14 L184 30 L210 30 L210 20 L228 20 L228 32 L250 32 L250 12 L268 12 L268 28 L294 28 L294 36 L320 36 L320 30 L340 30 L340 60 Z"
                          fill="#0a0510" opacity=".85"/>
                  </svg>
                </div>
                <div className="hero-figure">
                  <Silhouette />
                </div>
              </div>

              <div className="hero-name-block">
                <h2 className="hero-name">{hero.name}</h2>
                <div className="hero-class-pill" name="PbpHeroClassPill">
                  <span className="cc tl"></span><span className="cc br"></span>
                  <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                    <path d="M5 5 L11 11 M5 11 L11 5"/>
                    <path d="M13 11 L19 5 M13 5 L19 11"/>
                    <path d="M9 14 L9 19 L14 19" />
                    <path d="M15 14 L15 19 L10 19" opacity=".5"/>
                  </svg>
                  <span className="label">{hero.classKo}</span>
                </div>
                <div className="hero-rarity">
                  {[0,1,2].map(i => <i key={i}></i>)}
                </div>
                <div className="hero-level">Lv <b>8</b></div>
              </div>
            </div>
          </div>

          {/* CENTER — board */}
          <div className="pb-center">
            <div className="board" name="PbpBoard">
              <BoardSvg
                nodes={nodes}
                selectedId={selectedId}
                showGuides={tweaks.showGuides}
                ringDensity={tweaks.ringDensity}
              />
              {nodes.map(n => (
                <NodeButton
                  key={n.id}
                  node={n}
                  selected={selectedId === n.id}
                  onClick={setSelectedId}
                />
              ))}
              <div className="hub" name="PbpHubBadge">
                <I.Swords className="swords" />
                <span className="name">{hero.classEn}</span>
              </div>
            </div>
          </div>

          {/* RIGHT — detail */}
          <div className="pb-right">
            <DetailCard
              node={selected}
              nodeById={nodeById}
              onActivate={handleActivate}
              points={points}
            />
          </div>
        </div>

        {/* BOTTOM BAR */}
        <div className="pb-bottom">
          <span className="pb-bottom-divider"></span>
          <button type="button" name="PbpHeroInfo" className="btn-foot">
            <span className="cc tl"></span><span className="cc br"></span>
            <I.ChevL className="icon" />
            <span>영웅 정보</span>
          </button>
          <div className="pb-info">
            <span className="icon">i</span>
            <span>활성화는 즉시 적용됩니다</span>
          </div>
          <button type="button" name="PbpReset" className="btn-foot" onClick={handleReset}>
            <span className="cc tl"></span><span className="cc br"></span>
            <I.Refresh className="icon" />
            <span>초기화</span>
            <span className="gold-cost">(−100 골드)</span>
          </button>
        </div>
      </div>

      {/* Tweaks panel (host-toggled) */}
      {tweaksOpen && (
        <TweaksPanel
          tweaks={tweaks}
          setTweak={setTweak}
          onClose={() => {
            setTweaksOpen(false);
            window.parent?.postMessage({ type: "__edit_mode_dismissed" }, "*");
          }}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
