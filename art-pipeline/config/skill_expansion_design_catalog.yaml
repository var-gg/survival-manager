schema: skill_expansion_design_catalog_v1
updated_at: '2026-05-18'
quota_source: art-pipeline/config/combat_roster_skill_quota.yaml
purpose: Concrete 36-skill expansion backlog for the 22-hero target roster, designed
  before VFX lock and icon generation.
implementation_status: authored_skill_assets_materialized
ownership_policy: Skills are class-pool content, not character-owned loadout bindings;
  concrete loadout/equipment/gacha acquisition rules remain deferred to Pindoc.
icon_pipeline:
  batch_size: 4
  sheet_size: 1568x1568
  cell_size: 768x768
  gutter: 32px #FF00FF
  output_dir: art-pipeline/output/icons/skill/expansion_v1
  selected_dir: art-pipeline/selected/icons/skill/expansion_v1
  chroma_contract: Outside each symbol's 2-4 px dark outer stroke, every pixel must
    be flat #FF00FF with no shadow, blur, glow, particles, haze, or residue.
  first_sheet_ref_strategy: Use four existing character portrait outputs as style/color
    references for the first mixed seed sheet.
  followup_ref_strategy: After the first sheet is split, promote 2-3 generated icon
    pieces into art-pipeline/ref/icons and attach those as canonical style refs for
    later sheets.
  promoted_style_refs:
  - ref_id: skill_expansion_v1_style_ref_01
    source_icon_id: skill_icon_aegis_sentinel_oath
  - ref_id: skill_expansion_v1_style_ref_02
    source_icon_id: skill_icon_prism_lance
  - ref_id: skill_expansion_v1_style_ref_03
    source_icon_id: skill_icon_shardblade_sever
slot_backlog:
  CoreActive: 10
  UtilityActive: 10
  Passive: 14
  Support: 2
class_backlog:
  vanguard: 12
  ranger: 10
  duelist: 7
  mystic: 7
