    by_slot:
      CoreActive: 10
      UtilityActive: 10
      Passive: 14
      Support: 2
    by_class_minimum:
      vanguard: 12
      ranger: 10
      duelist: 7
      mystic: 7
      cross_class: 0
  class_skill_targets:
    vanguard:
      total: 24
      slot_minimums:
        CoreActive: 6
        UtilityActive: 6
        Passive: 6
        Support: 6
    ranger:
      total: 24
      slot_minimums:
        CoreActive: 6
        UtilityActive: 6
        Passive: 6
        Support: 6
    duelist:
      total: 20
      slot_minimums:
        CoreActive: 5
        UtilityActive: 5
        Passive: 5
        Support: 5
    mystic:
      total: 20
      slot_minimums:
        CoreActive: 5
        UtilityActive: 5
        Passive: 5
        Support: 5
