schema: combat_roster_skill_quota_v1
updated_at: '2026-05-18'
source_truth:
  runtime_characters: Assets/Resources/_Game/Content/Definitions/Characters/*.asset
  runtime_archetypes: Assets/Resources/_Game/Content/Definitions/Archetypes/*.asset
  runtime_skills: Assets/Resources/_Game/Content/Definitions/Skills/*.asset
  story_character_manifest: art-pipeline/config/character_asset_manifest.yaml
policy:
  roster_layers:
    runtime_playable_current: 16
    story_hero_target_non_npc: 22
    story_portrait_total_with_npc: 28
    story_npc_targets: 6
  interpretation: Runtime currently closes 16 playable CharacterDefinition/ArchetypeDefinition
    assets. The 22 number is the non-NPC hero/story combat candidate count in the
    character art manifest; six of those are not runtime playable yet.
target_roster:
  total_playable_heroes: 22
  class_targets:
    vanguard: 6
    ranger: 6
    duelist: 5
    mystic: 5
  pending_runtime_heroes:
  - id: hero_echo_savant
    target_class: mystic
    combat_class: echo_savant
    source: art-pipeline/config/character_asset_manifest.yaml
  - id: hero_aegis_sentinel
    target_class: vanguard
    combat_class: aegis_sentinel
    source: art-pipeline/config/character_asset_manifest.yaml
  - id: hero_shardblade
    target_class: duelist
    combat_class: shardblade
    source: art-pipeline/config/character_asset_manifest.yaml
  - id: hero_prism_seeker
    target_class: ranger
    combat_class: prism_seeker
    source: art-pipeline/config/character_asset_manifest.yaml
  - id: hero_ember_runner
