notes:
- Do not treat story NPC portrait targets as playable combat quota.
- Existing support overages may remain; quota gaps should be closed by adding
  underrepresented active, passive, status, and non-aura delivery skills.
- Pindoc remains the durable design/wiki surface; this file is the local
  implementation and art-pipeline quota contract until the Pindoc task can be
  updated.
