    minimum: Preserve the current 3.25 skill-per-runtime-character density when
      expanding from 16 to 22 heroes.
    target: Four meaningful skill/presentation handles per target hero before
      locking the VFX list.
  slot_targets:
    CoreActive: 22
    UtilityActive: 22
    Passive: 22
    Support: 22
  creation_backlog_from_current_runtime:
