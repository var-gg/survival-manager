schema: content_icon_catalog_v1
updated_at: 2026-05-18

policy:
  runtime_root: Assets/Resources/_Game/Art/Icons
  source_truth: "Unity authored assets own SkillDefinitionAsset.IconId, ItemBaseDefinition.IconId, and AugmentDefinition.IconId as stable presentation handles."
  runtime_binding: "Runtime UI resolves IconId to Resources path; combat simulation and FastUnit lanes never depend on Sprite or Texture2D."
  generation_batch: "Generate 4 icons per imagegen call as a 1568x1568 2x2 sheet: 768px cells with 32px #FF00FF gutters."
  single_icon_source: "Single-icon subjects may use 1024x1024, but sheet generation is preferred for list work."
  final_canvas: "Sync output normalizes each icon to a 512x512 transparent PNG with the source centered inside a 448px safe box."
  chroma_contract: "Source background must be flat #FF00FF from canvas edge to subject outline."
  outline_contract: "Every generated symbol needs a clean outer stroke. Outside that stroke, there must be no shadow, blur, glow, particles, or semi-transparent residue."
  negative_prompt: "No text, no numerals, no frame, no character portrait, no scenery, no magenta/fuchsia subject color."

