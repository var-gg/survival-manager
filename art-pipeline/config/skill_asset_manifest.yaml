schema: skill_asset_manifest_v1
updated_at: '2026-05-18'
policy:
  hierarchy: Skill images live under art-pipeline/subjects/icons/skill/**, not under
    character subject folders.
  gameplay_binding: Runtime ownership is one authored SkillDefinitionAsset.Id -> one
    SkillDefinitionAsset.IconId -> Sprite/presentation catalog.
  canonical_catalog: Canonical skill icon sheets write split outputs to art-pipeline/output/icons/skill/catalog_v2/skill_icon_{skill}.png.
  generation_batch: 'Generate 4 icons per imagegen call as a 1568x1568 2x2 sheet:
    768px cells with 32px #FF00FF gutters.'
  placeholder_backfill: catalog_v2 files may be temporarily copied from catalog_v1
    motifs only to keep runtime icons nonblank while fresh imagegen is blocked.
  retired_character_theme_bridge: Former character_theme_* sheets were migration seeds
    only and are no longer active skill icon generation units.
profiles:
  skill_catalog_sheet:
    description: Canonical 2x2 skill icon sheet grouped by skill semantics, not by
      character ownership.
    required:
    - catalog_sheet
asset_requirements:
  catalog_sheet:
    kind: sheet_output
    subject: subjects/icons/skill/{id}/default.md
    outputs:
    - output/{id}/default.png
    dynamic_outputs:
      from_frontmatter: skills
      pattern: output/icons/skill/catalog_v2/skill_icon_{skill}.png
