schema: skill_asset_manifest_v1
updated_at: 2026-05-13

policy:
  hierarchy: "Skill images live under art-pipeline/subjects/icons/skill/**, not under character subject folders."
  gameplay_binding: "Runtime ownership must be SkillId -> IconId -> Sprite/presentation catalog. Character pages do not own skill images."
  canonical_catalog: "Canonical skill icon sheets use profile skill_catalog_sheet and write split outputs to output/icons/skill/catalog_v1/skill_icon_{skill}.png."
  retired_character_theme_bridge: "Former character_theme_* sheets were migration seeds only and are no longer active skill icon generation units."

profiles:
  skill_catalog_sheet:
    description: "Canonical 2x2 skill icon sheet grouped by skill semantics, not by character ownership."
    required:
      - catalog_sheet

asset_requirements:
  catalog_sheet:
    kind: sheet_output
    subject: subjects/icons/skill/{id}/default.md
    outputs:
      - output/{id}/default.png
    dynamic_outputs:
      from_frontmatter: skills
      pattern: output/icons/skill/catalog_v1/skill_icon_{skill}.png

assets:
  - id: skill_catalog_protection_recovery
    profile: skill_catalog_sheet
    semantic_family: protection_recovery
    binding_status: canonical_skill_catalog
  - id: skill_catalog_precision_projectile
    profile: skill_catalog_sheet
    semantic_family: precision_projectile
    binding_status: canonical_skill_catalog
  - id: skill_catalog_memory_ritual
    profile: skill_catalog_sheet
    semantic_family: memory_ritual
    binding_status: canonical_skill_catalog
  - id: skill_catalog_assault_motion
    profile: skill_catalog_sheet
    semantic_family: assault_motion
    binding_status: canonical_skill_catalog
