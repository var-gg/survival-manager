schema: skill_icon_generation_matrix_v1
updated_at: '2026-05-18'
source_truth: Assets/Resources/_Game/Content/Definitions/Skills/*.asset
runtime_policy: Each authored SkillDefinitionAsset owns a stable unique IconId; character
  art never owns skill icons.
current_asset_status: fresh_render_pending; catalog_v2 may be placeholder-backfilled
  from catalog_v1 motif art until ChatGPT image generation login is available
imagegen_policy:
  batch_size: 4
  sheet_size: 1568x1568
  cell_size: 768x768
  gutter: '32px #FF00FF'
  output_dir: art-pipeline/output/icons/skill/catalog_v2
  outer_stroke: '2-4 px continuous dark stroke; outside stroke is flat #FF00FF only'
